<?xml version="1.0" encoding="UTF-8"?>
<!-- Bites & Baits — embarcações SVG locais. Arte visual separada de dados e gameplay. -->
<svg xmlns="http://www.w3.org/2000/svg">
  <style>
    .boat-stroke { stroke:#18212b; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .boat-fine { stroke:#18212b; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .boat-highlight { stroke:#f5f7f8; stroke-width:2; stroke-linecap:round; fill:none; opacity:.7; }
    .water-line { stroke:#4c9fc4; stroke-width:5; stroke-linecap:round; fill:none; }
  </style>

  <!-- CANOA — casco de madeira, banco, remos e corda de proa -->
